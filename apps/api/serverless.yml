service: invy-api

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs20.x
  architecture: arm64  # Graviton for better performance and cost
  region: ${opt:region, 'eu-west-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 1024  # More memory = more CPU = faster cold starts
  timeout: 30
  environment:
    NODE_ENV: ${self:provider.stage}
    # SSM Parameter Store paths (cached by extension)
    DB_HOST: ${ssm:/invy/${self:provider.stage}/db/host, ''}
    DB_PORT: ${ssm:/invy/${self:provider.stage}/db/port, '5432'}
    DB_USERNAME: ${ssm:/invy/${self:provider.stage}/db/username, ''}
    DB_PASSWORD: ${ssm:/invy/${self:provider.stage}/db/password, ''}
    DB_DATABASE: ${ssm:/invy/${self:provider.stage}/db/database, ''}
    ALLOWED_ORIGINS: ${ssm:/invy/${self:provider.stage}/allowed-origins, '*'}
    # Extension caching settings
    SSM_PARAMETER_STORE_TTL: 300  # Cache for 5 minutes
    PARAMETERS_SECRETS_EXTENSION_LOG_LEVEL: warn

plugins:
  - serverless-esbuild
  - serverless-offline

custom:
  esbuild:
    bundle: true
    minify: true
    sourcemap: true
    exclude:
      - '@aws-sdk/*'  # Use Lambda's built-in AWS SDK
    target: node20
    platform: node
    concurrency: 10
  serverless-offline:
    httpPort: 3010
    noPrependStageInUrl: true

functions:
  api:
    handler: src/lambda.handler
    layers:
      # AWS Parameters and Secrets Lambda Extension for SSM caching
      - arn:aws:lambda:${aws:region}:177933569100:layer:AWS-Parameters-and-Secrets-Lambda-Extension:11
    events:
      - http:
          path: /
          method: ANY
          cors: true
      - http:
          path: /{proxy+}
          method: ANY
          cors: true
    # VPC configuration for RDS access (uncomment when deployed)
    # vpc:
    #   securityGroupIds:
    #     - ${ssm:/invy/${self:provider.stage}/vpc/sg-id}
    #   subnetIds:
    #     - ${ssm:/invy/${self:provider.stage}/vpc/subnet-1}
    #     - ${ssm:/invy/${self:provider.stage}/vpc/subnet-2}

package:
  individually: true
  patterns:
    - '!node_modules/**'
    - '!src/**'
    - '!test/**'
    - '!tests/**'
    - '!*.md'
    - '!.git/**'
